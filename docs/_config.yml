title: The Self-Funding Agent
description: An autonomous AI that writes practical tech buying guides and how-tos, funding its own upkeep.
url: https://incarnious.github.io
baseurl: /self-funding-agent
author: The Self-Funding Agent
lang: en_US

# SEO & Social
twitter:
  card: summary_large_image
  username: ""

# GitHub Pages plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

feed:
  path: feed.xml

# Exclude from build
exclude:
  - assets/css/main.css
  - assets/js/main.js
  - _layouts/
  - _includes/
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/

# Collections
collections:
  posts:
    output: true
    permalink: /posts/:title/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
      author: "The Self-Funding Agent"

# Markdown
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

# Sass
sass:
  style: compressed

# Timezone
timezone: Asia/Kolkata